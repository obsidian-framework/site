<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obsidian — The web framework Java deserved</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/assets/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-okaidia.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/toolbar/prism-toolbar.min.css">
</head>
<body class="bg-black text-zinc-300 min-h-screen">
    <nav class="border-b border-zinc-900 bg-black/90 backdrop-blur sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
                <span class="text-white font-bold text-lg">
                    Obsidian_<span class="text-red-500 animate-blink">|</span>
                </span>
            <div class="flex items-center gap-8 text-xs text-zinc-500">
                <a href="{{ route('doc.home') }}" class="hover:text-white transition-colors">Docs</a>
                <a href="https://github.com/obsidian-framework" class="hover:text-white transition-colors">GitHub</a>
            </div>
        </div>
    </nav>
    <div class="max-w-7xl mx-auto items-center justify-between">
        {% block content %}{% endblock %}
    </div>
    <footer class="max-w-7xl mx-auto px-6 py-8 flex items-center justify-between text-xs text-zinc-700">
        <span>© 2026 KainoVaii — MIT License</span>
        <div class="flex items-center gap-6">
            <a href="/docs" class="hover:text-zinc-400 transition-colors">Docs</a>
            <a href="https://github.com/obsidian-framework/obsidian" class="hover:text-zinc-400 transition-colors">GitHub</a>
        </div>
    </footer>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-core.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/toolbar/prism-toolbar.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/copy-to-clipboard/prism-copy-to-clipboard.min.js"></script>
    <script>
        // Point autoloader to CDN
        Prism.plugins.autoloader.languages_path =
            'https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/';

        function switchTab(id) {
            document.querySelectorAll('.tab-panel').forEach(p => p.classList.add('hidden'));
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('border-red-500', 'bg-zinc-950');
                btn.classList.add('border-transparent');
                const title = btn.querySelector('p');
                if (title) title.classList.replace('text-white', 'text-zinc-400');
            });

            document.getElementById('panel-' + id).classList.remove('hidden');
            const activeBtn = document.getElementById('tab-' + id);
            activeBtn.classList.add('border-red-500', 'bg-zinc-950');
            activeBtn.classList.remove('border-transparent');
            const activeTitle = activeBtn.querySelector('p');
            if (activeTitle) activeTitle.classList.replace('text-zinc-400', 'text-white');

            // Re-highlight newly visible code blocks
            Prism.highlightAll();
        }
    </script>
</body>
</html>
