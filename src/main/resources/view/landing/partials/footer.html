<script src="/assets/js/prism-langage-bungle.js"></script>
<script>
    function switchTab(id) {
        document.querySelectorAll('.tab-panel').forEach(p => p.classList.add('hidden'));
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.classList.remove('border-red-500', 'bg-zinc-950');
            btn.classList.add('border-transparent');
            const title = btn.querySelector('p');
            if (title) title.classList.replace('text-white', 'text-zinc-400');
        });

        document.getElementById('panel-' + id).classList.remove('hidden');
        const activeBtn = document.getElementById('tab-' + id);
        activeBtn.classList.add('border-red-500', 'bg-zinc-950');
        activeBtn.classList.remove('border-transparent');
        const activeTitle = activeBtn.querySelector('p');
        if (activeTitle) activeTitle.classList.replace('text-zinc-400', 'text-white');

        // Re-highlight newly visible code blocks
        Prism.highlightAll();
    }
</script>
