<div live:id="{{ _id }}" class="bg-zinc-950 border border-zinc-800 p-6 mb-4" xmlns:live="http://www.w3.org/1999/xhtml">
    <p class="text-xs text-zinc-600 uppercase tracking-widest mb-6">Counter</p>
    
    <div class="text-center mb-6">
        <div class="text-6xl font-bold text-white mb-2">{{ count }}</div>
        <div class="text-zinc-600 text-xs uppercase tracking-widest">{{ message }}</div>
    </div>
    
    <div class="grid grid-cols-2 gap-px bg-zinc-800">
        <button 
            live:click="increment"
            live:loading.add="opacity-50"
            class="bg-black px-4 py-4 text-zinc-400 hover:text-white hover:bg-zinc-950 transition-colors text-sm font-bold uppercase tracking-widest"
        >
            + Increment
        </button>
        <button 
            live:click="decrement"
            live:loading.add="opacity-50"
            class="bg-black px-4 py-4 text-zinc-400 hover:text-white hover:bg-zinc-950 transition-colors text-sm font-bold uppercase tracking-widest"
        >
            − Decrement
        </button>
        <button
            live:click="add5"
            live:loading.add="opacity-50"
            class="bg-black px-4 py-4 text-zinc-400 hover:text-white hover:bg-zinc-950 transition-colors text-sm font-bold uppercase tracking-widest"
        >
            + 5
        </button>
        <button 
            live:click="reset"
            live:confirm="Reset the counter to 0?"
            live:loading.add="opacity-50"
            class="bg-black px-4 py-4 text-red-500 hover:text-red-400 hover:bg-zinc-950 transition-colors text-sm font-bold uppercase tracking-widest"
        >
            Reset
        </button>
    </div>

    <!--
    <div live:loading style="display: none;" class="mt-4 text-center">
        <div class="inline-flex items-center gap-2 text-zinc-600">
            <span class="text-red-500 animate-pulse-dot text-xs">●</span>
            <span class="text-xs uppercase tracking-widest">Updating...</span>
        </div>
    </div>
    -->
</div>
